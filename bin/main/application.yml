# spring.application.name=config-service

server:
  port: 8888
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 200
      min-spare: 10
      max-queue-size: 1000

spring:
  aplication:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Tyranno-Rex/cnsia-config.git
          default-label: main