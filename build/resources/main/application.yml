server:
  port: 8888
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 200
      min-spare: 10
      max-queue-size: 1000

spring:
  aplication:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Tyranno-Rex/cnsia-config-repo.git
          default-label: main
          clone-on-start: true  # time limit connection with remote repository
          timeout: 5            # time limit connection with remote repository
          force-pull: true      # force pull the latest changes from the remote repository
  